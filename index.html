<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bellamarket · Gestion</title>
<meta name="theme-color" content="#010101">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivoire:#F6F1E7; --papier:#FFFDF8; --noir:#16130F; --logo:#010101;
  --or:#C9A24A; --or-fonce:#8F6B1B; --trait:#E4DAC4; --doux:#6B6354;
  --ok:#2F7D4F; --alerte:#B3402A; --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivoire);color:var(--noir);font:16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.titre{font-family:'Playfair Display',Georgia,serif;font-weight:600;margin:0;letter-spacing:.2px}
h1{font-size:2rem;line-height:1.2}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Connexion */
#login{display:grid;place-items:center;min-height:100vh;background:var(--logo);padding:24px}
.login-box{width:100%;max-width:360px;text-align:center}
.login-box img{width:240px;max-width:70%;height:auto;display:block;margin:0 auto 8px}
.login-box .filet{height:1px;background:var(--or);width:64px;margin:0 auto 24px}
.login-box label{display:block;text-align:left;color:#cfc6b0;font-size:.9rem;margin:14px 0 4px}
.login-box input{width:100%;background:transparent;border:0;border-bottom:1px solid #6b5a2b;color:#fff;padding:10px 2px;font-size:1rem;border-radius:0}
.login-box input:focus{outline:none;border-bottom-color:var(--or)}
.login-box .btn{width:100%;margin-top:28px}
.login-box .lien{color:#cfc6b0;margin-top:16px}
#loginErr{color:#ff9d8a;min-height:1.4em;margin-top:12px;font-size:.92rem}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:0;border-radius:var(--r);background:var(--or);color:var(--noir);font-weight:700;cursor:pointer}
.btn:hover{background:#d6b25a}
.btn.sec{background:transparent;border:1px solid var(--noir);color:var(--noir)}
.btn.sec:hover{background:rgba(22,19,15,.06)}
.btn.petit{min-height:36px;padding:0 14px;font-size:.92rem}
.btn[disabled]{opacity:.5;cursor:default}
.lien{background:none;border:0;padding:6px 4px;min-height:36px;cursor:pointer;color:var(--or-fonce);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.lien.danger{color:var(--alerte)}
a.lien{display:inline-flex;align-items:center}

/* Structure */
#app{display:none}
#app.on{display:block}
aside.lat{position:fixed;inset:0 auto 0 0;width:248px;background:var(--logo);color:#e9e1cc;display:flex;flex-direction:column;padding:12px 0 20px}
aside.lat img{width:170px;display:block;margin:0 auto 6px}
aside.lat nav{display:flex;flex-direction:column;padding:8px 12px;gap:2px}
.nav-i{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border:0;background:none;border-radius:var(--r);color:#cfc6b0;cursor:pointer;text-align:left;width:100%}
.nav-i:hover{background:rgba(255,255,255,.07)}
.nav-i.actif{color:var(--or);background:rgba(201,162,74,.12);font-weight:700}
.badge{margin-left:auto;background:var(--or);color:var(--noir);border-radius:99px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:.78rem;font-weight:700;padding:0 6px}
aside.lat .bas{margin-top:auto;padding:0 24px;color:#8d856f;font-size:.85rem}
main{margin-left:248px;padding:36px 48px 64px;max-width:1100px}
nav.bas-nav{display:none}
.entete{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.sous{color:var(--doux);margin:4px 0 20px;text-transform:capitalize}
.vide{color:var(--doux);padding:28px 0}

/* Chiffres clés */
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--noir);border-bottom:1px solid var(--trait);margin:8px 0 32px}
.chiffre{padding:18px 20px 18px 0}
.chiffre+.chiffre{padding-left:24px;border-left:1px solid var(--trait)}
.chiffre .n{font-family:'Playfair Display',Georgia,serif;font-size:2.1rem;font-weight:600;line-height:1.1}
.chiffre .l{color:var(--doux);font-size:.92rem;margin-top:4px}
.panneau{background:var(--papier);border:1px solid var(--trait);border-radius:14px;padding:22px 24px;margin-bottom:24px}
.prochain{display:flex;gap:16px;align-items:center;background:var(--logo);color:#fff;border-radius:14px;padding:18px 22px;margin-bottom:24px}
.prochain .h{font-family:'Playfair Display',Georgia,serif;font-size:2rem;color:var(--or)}
.prochain small{color:#cfc6b0;display:block}
.deux{display:grid;grid-template-columns:3fr 2fr;gap:24px}

/* Listes */
.liste{list-style:none;margin:0;padding:0}
.liste>li{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--trait);flex-wrap:wrap}
.liste>li:last-child{border-bottom:0}
.heure{font-family:'Playfair Display',Georgia,serif;font-weight:600;min-width:112px}
.corps{flex:1;min-width:180px}
.corps b{display:block}
.corps span{color:var(--doux);font-size:.93rem}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ligne{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;text-align:left;cursor:pointer;padding:0;min-height:44px}
.montant{font-weight:700;white-space:nowrap}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.82rem;font-weight:700;border:1px solid}
.chip.confirme{color:var(--or-fonce);border-color:var(--or)}
.chip.termine{color:var(--ok);border-color:var(--ok)}
.chip.annule{color:var(--alerte);border-color:var(--alerte)}
.chip.nouvelle{background:var(--or);border-color:var(--or);color:var(--noir)}
.chip.traitee{color:var(--doux);border-color:var(--trait)}

/* Formulaires */
.champ{display:block;margin-bottom:14px}
.champ>span{display:block;font-size:.9rem;color:var(--doux);margin-bottom:4px}
.champ input,.champ select,.champ textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid #cdbf9f;border-radius:var(--r);background:#fff}
.champ textarea{min-height:90px;resize:vertical}
.deux-champs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.barre-date{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.barre-date input{min-height:44px;padding:0 12px;border:1px solid #cdbf9f;border-radius:var(--r);background:#fff}
.onglets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.onglets .btn.actif{background:var(--noir);color:var(--or)}

/* Graphique en barres */
.barres{display:flex;align-items:stretch;gap:6px;height:190px}
.barre{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.barre .val{font-size:.72rem;color:var(--doux);height:18px;white-space:nowrap}
.barre .piste{flex:1;width:100%;display:flex;align-items:flex-end}
.barre i{display:block;width:100%;background:var(--or);border-radius:4px 4px 0 0;min-height:2px}
.barre b{font-size:.78rem;font-weight:500;color:var(--doux);margin-top:6px;height:18px}
.classement{list-style:none;margin:0;padding:0}
.classement li{padding:10px 0;border-bottom:1px solid var(--trait)}
.classement .t{display:flex;justify-content:space-between;gap:12px}
.classement .jauge{height:4px;background:var(--trait);border-radius:4px;margin-top:6px}
.classement .jauge i{display:block;height:100%;background:var(--or);border-radius:4px}

/* Fenêtres */
#modal{display:none;position:fixed;inset:0;z-index:50}
#modal.on{display:block}
.fond{position:absolute;inset:0;background:rgba(1,1,1,.55)}
.feuille{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:90vh;overflow:auto;background:var(--papier);border-radius:16px;padding:24px}
.feuille h2{margin-bottom:16px}
.feuille .pied{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
#alerte{display:none;position:fixed;inset:0;z-index:70;background:rgba(1,1,1,.7);place-items:center;padding:20px}
#alerte.on{display:grid}
.alerte-box{background:var(--logo);color:#fff;border:1px solid var(--or);border-radius:16px;padding:28px;max-width:420px;width:100%;text-align:center}
.alerte-box .h{font-family:'Playfair Display',Georgia,serif;font-size:2.4rem;color:var(--or)}
.alerte-box .btn{margin-top:18px;width:100%}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--noir);color:#fff;padding:10px 18px;border-radius:99px;font-size:.95rem;border:1px solid var(--or)}
.simple-liste{list-style:none;margin:0;padding:0}
.simple-liste li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--trait);font-size:.95rem}
.note{color:var(--doux);font-size:.92rem}
.interrupteur{display:flex;align-items:center;gap:10px;min-height:44px}
.interrupteur input{width:22px;height:22px;accent-color:var(--or-fonce)}

@media (max-width:900px){
  aside.lat{display:none}
  main{margin:0;padding:20px 16px calc(96px + env(safe-area-inset-bottom));max-width:none}
  h1{font-size:1.6rem}
  nav.bas-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--logo);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
  .bas-nav .nav-i{flex-direction:column;gap:2px;padding:6px 0;min-height:54px;font-size:.74rem;justify-content:center;align-items:center;text-align:center}
  .bas-nav .badge{position:absolute;top:2px;right:18%;margin:0}
  .chiffres{grid-template-columns:1fr 1fr 1fr}
  .chiffre{padding:14px 8px 14px 0}
  .chiffre+.chiffre{padding-left:12px}
  .chiffre .n{font-size:1.35rem}
  .chiffre .l{font-size:.8rem}
  .deux{grid-template-columns:1fr}
  .panneau{padding:16px}
  .feuille{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:92vh;border-radius:16px 16px 0 0}
  .heure{min-width:0;width:100%}
  #toasts{bottom:100px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="login">
  <div class="login-box">
    <img data-logo alt="Bella Market">
    <div class="filet"></div>
    <form id="loginForm" autocomplete="on">
      <label for="lEmail">Adresse e-mail</label>
      <input id="lEmail" type="email" autocomplete="username" required>
      <label for="lMdp">Mot de passe</label>
      <input id="lMdp" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" id="lBtn">Se connecter</button>
      <div id="loginErr" role="alert"></div>
      <button class="lien" type="button" id="lOubli">Mot de passe oublié</button>
    </form>
  </div>
</section>

<div id="app">
  <aside class="lat">
    <img data-logo alt="Bella Market">
    <nav id="navLat" aria-label="Navigation principale"></nav>
    <div class="bas">Gestion du salon</div>
  </aside>
  <main id="vue" tabindex="-1"></main>
  <nav class="bas-nav" id="navBas" aria-label="Navigation principale"></nav>
</div>

<div id="modal"></div>
<div id="alerte"></div>
<div id="toasts" aria-live="polite"></div>
